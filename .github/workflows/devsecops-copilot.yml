# Scans this repository's own engine with the published Action (dogfooding).
# examples/vulnerable-app is intentionally vulnerable, so only the engine is scanned.
name: DevSecOps Copilot
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write   # upload SARIF to GitHub code scanning

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Security & compliance scan
        id: copilot
        uses: souhail555/devsecops-copilot@v0.1.0
        with:
          path: copilot
          fail-on: high
        continue-on-error: true
      - uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: copilot-report/results.sarif
      - uses: actions/upload-artifact@v4
        with:
          name: compliance-report
          path: copilot-report/
      - name: Enforce gate
        if: steps.copilot.outcome == 'failure'
        run: exit 1
